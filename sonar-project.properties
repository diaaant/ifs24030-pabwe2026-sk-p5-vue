# Konfigurasi SonarQube untuk ifs24030-pabwe2026-sk-p5-vue
sonar.projectKey=ifs24030-pabwe2026-sk-p5-vue
sonar.projectName=ifs24030-pabwe2026-sk-p5-vue
sonar.sourceEncoding=UTF-8

# Kode sumber & berkas test
sonar.sources=src
sonar.exclusions=**/*.test.js,src/main.js,src/setupTests.js,src/test-utils.js
sonar.tests=src
sonar.test.inclusions=**/*.test.js

# Laporan coverage dari `vitest run --coverage` (reporter lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.js,src/setupTests.js,src/test-utils.js,**/*.test.js
